<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>专业图表 · Pro Chart</title>
<style>
  :root{
    --bg:#080909;--panel:#0e0e11;--panel2:#131317;--border:#24242a;
    --text:#e8e8e9;--muted:#8b8b94;--accent:#f23c83;
    --up:#ef4b5e;--down:#3fbf8f;--warn:#f4cf4d;--ok:#48d6a4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:12px/1.6 Consolas,"Cascadia Code",ui-monospace,monospace;
    -webkit-tap-highlight-color:transparent}
  a{color:var(--accent);text-decoration:none}

  #top{display:flex;align-items:center;gap:9px;padding:8px 13px;flex-wrap:wrap;
    border-bottom:1px solid var(--border);background:var(--panel);position:sticky;top:0;z-index:30}
  #top h1{margin:0;font-size:12px;letter-spacing:.14em;font-weight:400;white-space:nowrap}
  .sub{color:var(--accent);font-size:9px;letter-spacing:.1em}
  select,input,button{background:#191a1e;color:var(--text);border:1px solid var(--border);
    padding:4px 7px;font:inherit;font-size:11px;border-radius:3px}
  button{cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:9px;
    border:1px solid var(--border);font-size:10px;color:var(--muted);white-space:nowrap}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
  .dot.err{background:var(--up)}
  .dot.idle{background:var(--muted)}

  #wrap{padding:10px 13px 40px;display:grid;gap:10px;max-width:2000px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:4px;min-width:0}
  .card>h2{margin:0;padding:6px 11px;font-size:10px;font-weight:400;color:var(--muted);
    letter-spacing:.08em;border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .card .body{padding:8px 11px}

  /* 图表容器必须 position:relative，tooltip 才能正确定位 */
  .chartbox{position:relative;padding:5px 0 0}
  canvas{display:block;width:100%}

  .legend{display:flex;gap:11px;flex-wrap:wrap;font-size:10px;color:var(--muted);
    padding:3px 11px 6px}
  .legend i{display:inline-block;width:9px;height:2px;vertical-align:middle;margin-right:4px}

  .statrow{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;padding:0 11px 7px}
  .statrow b{font-weight:400;font-variant-numeric:tabular-nums}

  table{width:100%;border-collapse:collapse;font-size:11px}
  th,td{text-align:right;padding:4px 6px;border-bottom:1px solid #17171c;white-space:nowrap}
  th{color:var(--muted);font-weight:400;font-size:10px}
  th:first-child,td:first-child{text-align:left}
  td.num{font-variant-numeric:tabular-nums}
  tr.sel{background:#17171c}
  tr:hover{background:#141419;cursor:pointer}
  .tablewrap{overflow-x:auto}

  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
  label.f{display:flex;flex-direction:column;gap:2px;font-size:10px;color:var(--muted)}
  .note{color:var(--muted);font-size:10px;line-height:1.8;padding:8px 11px;
    background:#0b0b0e;border-left:2px solid var(--warn)}
  .note.ok{border-left-color:var(--ok)}
  #err{display:none;margin:0 13px;padding:9px 12px;border:1px solid var(--up);
    border-radius:4px;color:var(--up);background:#1a0d13;white-space:pre-wrap;font-size:11px}
  .warn-item{color:var(--warn);font-size:11px;padding:2px 0}
  .up{color:var(--up)} .dn{color:var(--down)} .wn{color:var(--warn)} .mut{color:var(--muted)}
  .badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:9px;
    border:1px solid currentColor}
  #bar{height:2px;background:var(--accent);width:0;transition:width .2s}
</style>
</head>
<body>

<div id="top">
  <h1>PRO CHART</h1>
  <div class="sub">专业图表</div>
  <span class="pill"><span class="dot idle" id="dot"></span><span id="status">加载中…</span></span>
  <span class="spacer"></span>
  <a href="/">看板</a>
  <a href="/decision.html">决策蛛网</a>
  <a href="/paper.html">模拟盘</a>
  <a href="/spider-viewer.html" target="_blank">美术</a>
</div>
<div id="err"></div>
<div id="bar"></div>

<div id="wrap">

  <!-- 工具栏 -->
  <div class="card">
    <div class="body">
      <div class="row">
        <label class="f">市场<select id="market"></select></label>
        <label class="f" style="min-width:170px">标的
          <input id="symSearch" type="search" placeholder="代码或名称…" autocomplete="off">
        </label>
        <label class="f">粒度<select id="interval"></select></label>
        <label class="f">根数
          <select id="limit">
            <option>250</option><option selected>500</option>
            <option>800</option><option>1200</option><option>2000</option>
          </select>
        </label>
        <button id="reload" class="primary">加载</button>
      </div>
      <div id="symResults" class="results"></div>
      <div id="symPicked" class="picked"></div>

      <div class="row" style="margin-top:9px">
        <button id="zoomIn">放大 +</button>
        <button id="zoomOut">缩小 −</button>
        <button id="reset">重置视口</button>
        <button id="toLatest">跳到最新</button>
        <button id="showAll">显示全部</button>
        <span class="mut" style="font-size:10px;align-self:center">
          <span id="vpInfo">—</span>
        </span>
      </div>
    </div>
  </div>

  <!-- 主图 -->
  <div class="card">
    <h2><span>K 线 · 指标</span>
      <span style="display:flex;gap:8px;align-items:center">
        <span class="mut" id="sigInfo">—</span>
        <select id="sigPick" title="图上买卖标记来自哪个策略"></select>
      </span>
    </h2>
    <div class="chartbox">
      <canvas id="cvMain"></canvas>
    </div>
    <div class="legend" id="legendMain"></div>
    <div class="mut" id="mainInfo" style="padding:0 11px 5px;font-size:10px">—</div>
    <div class="statrow" id="ohlcRow">
      <span class="mut">把光标移到图上查看某根 K 线的详细数据</span>
    </div>
  </div>

  <!-- MACD -->
  <div class="card">
    <h2><span>MACD</span></h2>
    <div class="chartbox"><canvas id="cvMacd"></canvas></div>
    <div class="legend" id="legendMacd"></div>
  </div>

  <!-- RSI / KDJ 切换 -->
  <div class="card">
    <h2><span>震荡指标</span>
      <span>
        <button id="oscToggle" style="padding:1px 8px">RSI / KDJ</button>
      </span>
    </h2>
    <div class="chartbox"><canvas id="cvOsc"></canvas></div>
    <div class="legend" id="legendOsc"></div>
  </div>

  <!-- 参数优化 -->
  <div class="card">
    <h2><span>参数优化</span><span class="mut" id="optInfo">—</span></h2>
    <div class="body">
      <div class="row">
        <label class="f">策略<select id="optStrategy"></select></label>
        <label class="f">方法
          <select id="optMethod">
            <option value="grid">网格搜索</option>
            <option value="random">随机搜索</option>
          </select>
        </label>
        <label class="f">组合数<input type="number" id="optCombos" value="60" min="4" max="600" step="4" style="width:74px"></label>
        <label class="f">训练集占比<input type="number" id="optRatio" value="0.7" min="0.3" max="0.9" step="0.05" style="width:74px"></label>
        <button id="optRun" class="primary">开始优化</button>
      </div>
      <div id="optParamSpace" class="mut" style="font-size:10px;margin-top:7px">—</div>
      <div class="note" style="margin-top:9px">
        <b>样本外验证是强制的</b>：参数只在训练集上挑，然后用挑出的参数在验证集上跑一遍。
        <br>「训练」列好看不代表能赚钱 —— <b>「验证」列才是可信参考</b>。
        如果验证明显差于训练，就是过拟合。
        <br>排序只看训练集表现。用验证集排序等于把验证集也变成训练集，验证就失效了。
      </div>
    </div>
  </div>

  <div class="card" id="optResultCard" style="display:none">
    <h2><span>优化结果</span><span class="mut" id="optResultMeta">—</span></h2>
    <div class="body" style="padding:0">
      <div id="optWarnings"></div>
      <div class="tablewrap"><table id="optTable">
        <thead><tr>
          <th>参数组合</th><th>训练</th><th>验证</th><th>差距</th>
          <th>全样本</th><th>回撤</th><th>夏普</th><th>交易</th>
        </tr></thead>
        <tbody></tbody>
      </table></div>
    </div>
  </div>
</div>

<script type="module">
import { Viewport, Chart, Tooltip, seriesFrom, markersFrom } from './chart.js';

const $ = id => document.getElementById(id);
let META = null, DATA = null, PICKED = null;
let vp = null, cvMain = null, cvMacd = null, cvOsc = null;
let tt = null, OSC = 'rsi';

const fmt = (v, d = 2) => {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  const n = Number(v);
  const zero = 0.5 * Math.pow(10, -d);
  return (Math.abs(n) < zero ? 0 : n).toLocaleString('zh-CN',
    { minimumFractionDigits: d, maximumFractionDigits: d });
};
const pctStr = (v, d = 2) => (v === null || v === undefined) ? '—'
  : (v >= 0 ? '+' : '') + Number(v).toFixed(d) + '%';
const cls = v => (v === null || v === undefined) ? 'mut' : (v > 0 ? 'up' : v < 0 ? 'dn' : 'mut');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function fail(msg) {
  const e = $('err'); e.style.display = 'block'; e.textContent = msg;
  $('status').textContent = '出错'; $('dot').className = 'dot err';
}
function clearErr() { $('err').style.display = 'none'; }
function setStatus(t, kind = 'ok') {
  $('status').textContent = t;
  $('dot').className = 'dot' + (kind === 'err' ? ' err' : kind === 'idle' ? ' idle' : '');
}
async function api(path) {
  const r = await fetch(path);
  const d = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
  return d;
}

// ══════════════════════════════════════════════════════
//  初始化
// ══════════════════════════════════════════════════════
// ⚠️ 全局错误兜底。
// 必须过滤掉 "ResizeObserver loop completed with undelivered notifications" ——
// 那是浏览器的良性警告（观察回调里改了布局时会发），不是真错误。
// 不过滤的话页面会在加载完成前就显示「出错」，看起来像整个挂了。
const BENIGN = /ResizeObserver loop|ResizeObserver loop limit/i;
addEventListener('error', e => {
  const msg = e.message || '';
  if (BENIGN.test(msg)) { e.stopImmediatePropagation?.(); return; }
  if (!DATA) fail('脚本出错：' + msg);
});
addEventListener('unhandledrejection', e => {
  if (!DATA) fail('初始化失败：' + (e.reason?.message || e.reason));
});

async function boot() {
  let meta;
  try {
    meta = await api('/api/paper/meta');
  } catch (e) { return fail('无法读取元信息：' + e.message); }
  META = meta;

  $('market').innerHTML = Object.entries(meta.markets)
    .map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
  // 图表页默认 A 股：日线数据跨度长，更适合看指标
  $('market').value = 'ashare';

  // 优化器：只列可优化的策略，并明说哪些不能
  try {
    const om = await api('/api/optimize/meta');
    $('optStrategy').innerHTML = om.optimizable
      .map(k => `<option value="${k}">${om.strategies[k]}</option>`).join('');
    const noOpt = Object.keys(om.strategies).filter(k => !om.optimizable.includes(k));
    if (noOpt.length) {
      $('optParamSpace').innerHTML =
        `可优化：${om.optimizable.join(' · ')}　` +
        `<span class="mut">不可优化：${noOpt.map(k => om.strategies[k]).join(' · ')}（没有可调参数）</span>`;
    }
    window.__OPT_META = om;
  } catch (e) {
    $('optStrategy').innerHTML = '<option>（优化器不可用）</option>';
    $('optRun').disabled = true;
  }

  // 图表实例
  vp = new Viewport(0, 140);
  vp.on('change', () => { redrawAll(); updateVpInfo(); });

  cvMain = new Chart($('cvMain'), {
    viewport: vp, height: 340, type: 'candle', yFormat: 2,
    showVolume: true, gridY: 5,
  });
  cvMacd = new Chart($('cvMacd'), {
    viewport: vp, height: 120, type: 'histogram', gridY: 2, yFormat: 4,
  });
  cvOsc = new Chart($('cvOsc'), {
    viewport: vp, height: 120, type: 'line', valueKey: 'rsi', gridY: 3, yFormat: 1,
  });

  tt = new Tooltip(document.querySelector('#cvMain').parentElement);

  for (const cv of [cvMain, cvMacd, cvOsc]) {
    cv.on('hover', info => {
      if (!info.inside || info.index === null) { tt.hide(); renderOhlc(null); return; }
      tt.show(tooltipHtml(info.index), info.x, info.y);
      renderOhlc(info.index);
    });
  }

  $('market').onchange = () => { PICKED = null; fillIntervals(); renderSymbols(); };
  $('symSearch').oninput = onSearchInput;
  document.addEventListener('pointerdown', e => {
    if (!$('symResults').contains(e.target) && e.target !== $('symSearch')) {
      $('symResults').classList.remove('on');
    }
  });
  $('interval').onchange = () => load();
  $('limit').onchange = () => load();
  $('reload').onclick = () => load();

  $('zoomIn').onclick = () => vp.zoom(1.3, 0.5);
  $('zoomOut').onclick = () => vp.zoom(1 / 1.3, 0.5);
  $('reset').onclick = () => { vp.count = Math.min(140, DATA?.bars.length || 140); vp.toLatest(); };
  $('toLatest').onclick = () => vp.toLatest();
  $('showAll').onclick = () => vp.showAll();

  $('oscToggle').onclick = () => { OSC = OSC === 'rsi' ? 'kdj' : 'rsi'; $('oscToggle').textContent = OSC.toUpperCase(); applyIndicators(); redrawAll(); };

  $('sigPick').onchange = () => applyIndicators();

  $('optRun').onclick = runOptimize;

  fillIntervals(); renderSymbols();
  await load();
}

function fillIntervals() {
  const m = META.markets[$('market').value];
  $('interval').innerHTML = m.intervals.map(i => `<option value="${i}">${i}</option>`).join('');
  // 图表页偏好长周期：日线指标比 1 分钟有意义
  $('interval').value = m.intervals.includes('1d') ? '1d' : m.defaultInterval;
}

// ── 标的选择（与模拟盘一致的两层设计）──
function renderSymbols() {
  const m = META.markets[$('market').value];
  const set = m.symbolSets || { popular: [], total: 0 };
  $('symPicked').innerHTML = set.popular.map(p =>
    `<span class="chip ${PICKED?.value === p.value ? 'cur' : ''}"
      data-v="${p.value}" data-n="${esc(p.name)}">${esc(p.name)}</span>`).join('')
    + (set.total > set.popular.length
      ? `<span class="chip" data-more="1">…共 ${set.total} 个，可搜索</span>` : '');
  $('symPicked').querySelectorAll('.chip').forEach(c => {
    c.onclick = () => {
      if (c.dataset.more) { $('symSearch').focus(); return; }
      PICKED = { value: c.dataset.v, name: c.dataset.n };
      $('symSearch').value = '';
      $('symResults').classList.remove('on');
      renderSymbols();
      load();
    };
  });
  if (!PICKED) {
    const def = set.popular.find(p => p.value === m.defaultSymbol) || set.popular[0];
    if (def) PICKED = { value: def.value, name: def.name };
  }
}

let searchTimer = null;
function onSearchInput() {
  clearTimeout(searchTimer);
  const q = $('symSearch').value.trim();
  if (!q) { $('symResults').classList.remove('on'); return; }
  searchTimer = setTimeout(async () => {
    try {
      const d = await api(`/api/symbols/search?market=${$('market').value}&q=${encodeURIComponent(q)}&limit=30`);
      const rs = d.results || [];
      $('symResults').innerHTML = rs.length ? rs.map(r =>
        `<div class="it" data-v="${esc(r.value)}" data-n="${esc(r.name)}">
           <b>${esc(r.name)}</b>
           <span class="px">${esc(r.code)}${r.price ? ' · ' + r.price : ''}${
             r.changePct != null ? ` <i class="${r.changePct >= 0 ? 'up' : 'dn'}">${r.changePct >= 0 ? '+' : ''}${r.changePct}%</i>` : ''}</span>
         </div>`).join('')
        : `<div class="it" style="cursor:default"><span class="mut">没有匹配「${esc(q)}」的标的</span></div>`;
      $('symResults').classList.add('on');
      $('symResults').querySelectorAll('.it[data-v]').forEach(el => {
        el.onclick = () => {
          PICKED = { value: el.dataset.v, name: el.dataset.n };
          $('symSearch').value = '';
          $('symResults').classList.remove('on');
          renderSymbols(); load();
        };
      });
    } catch (e) {
      $('symResults').innerHTML = `<div class="it" style="cursor:default"><span class="up">搜索失败：${esc(e.message)}</span></div>`;
      $('symResults').classList.add('on');
    }
  }, 220);
}

// ══════════════════════════════════════════════════════
//  加载数据
// ══════════════════════════════════════════════════════
async function load() {
  if (!PICKED) return;
  const t0 = performance.now();
  setStatus('加载中…', 'idle');
  try {
    clearErr();
    const q = new URLSearchParams({
      market: $('market').value, symbol: PICKED.value,
      interval: $('interval').value, limit: $('limit').value,
    });
    const d = await api('/api/quant?' + q);
    DATA = d;
    const ms = Math.round(performance.now() - t0);
    const cached = d._cache?.hit ? ` · 缓存 ${Math.round((d._cache.ageMs || 0) / 1000)}s` : '';
    setStatus(`${d.meta.source} · ${ms}ms${cached}`);
    $('mainInfo').textContent = `${d.meta.name} ${d.meta.symbol} · ${d.meta.interval} · ${d.bars.length} 根 · ${d.meta.first || ''} → ${d.meta.last || ''}`;

    // 策略选择器：只在第一次填充，避免覆盖用户的选择
    const sigKeys = Object.keys(d.signals || {});
    if (sigKeys.length && $('sigPick').options.length !== sigKeys.length) {
      const keep = $('sigPick').value;
      $('sigPick').innerHTML = sigKeys
        .map(k => `<option value="${k}">${esc(d.signals[k].label || k)}</option>`).join('');
      if (keep && sigKeys.includes(keep)) $('sigPick').value = keep;
    }

    // 视口：默认看最后 140 根
    vp.count = Math.min(140, d.bars.length);
    vp.setTotal(d.bars.length);      // setTotal 里会贴右边缘
    applyIndicators();
  } catch (e) {
    fail('加载失败：' + e.message);
  }
}

/** 把指标的线与标记灌进三张图 */
function applyIndicators() {
  if (!DATA) return;
  const ind = DATA.indicators || {};
  const bars = DATA.bars || [];
  const has = k => !!ind[k];

  // ── 主图 ──
  cvMain.setBars(bars);
  cvMain.clearSeries();
  if (has('ema12')) cvMain.addSeries(seriesFrom(DATA, 'ema12', '#f4cf4d', { width: 1.3 }));
  if (has('ema26')) cvMain.addSeries(seriesFrom(DATA, 'ema26', '#3b82f6', { width: 1.3 }));
  if (has('sma20')) cvMain.addSeries(seriesFrom(DATA, 'sma20', '#a78bfa', { width: 1.1 }));
  if (has('bb_upper')) cvMain.addSeries(seriesFrom(DATA, 'bb_upper', '#4a4a54', { width: 1, dash: [3, 3] }));
  if (has('bb_lower')) cvMain.addSeries(seriesFrom(DATA, 'bb_lower', '#4a4a54', { width: 1, dash: [3, 3] }));
  if (has('bb_mid')) cvMain.addSeries(seriesFrom(DATA, 'bb_mid', '#3a3a44', { width: 1, dash: [2, 4] }));

  // 买卖标记：entries/exits 是**索引数组**（不是带 at/price 的对象）。
  // 最初按对象写，会静默画不出任何标记。
  const sigKey = $('sigPick')?.value || Object.keys(DATA.signals || {})[0];
  const sig = DATA.signals?.[sigKey];
  const mk = [];
  if (sig) {
    for (const i of (sig.entries || [])) {
      if (Number.isFinite(i) && bars[i]) mk.push({ index: i, side: 'buy', price: bars[i].l });
    }
    for (const i of (sig.exits || [])) {
      if (Number.isFinite(i) && bars[i]) mk.push({ index: i, side: 'sell', price: bars[i].h });
    }
  }
  cvMain.setMarkers(mk);
  $('sigInfo').textContent = sig
    ? `${sig.label} · ${sig.tradeCount ?? 0} 笔交易 · 当前${sig.current ? '持多' : '空仓'}`
    : '—';

  // ── MACD ──
  cvMacd.setBars(bars);
  cvMacd.clearSeries();
  cvMacd.setHistogram(has('macd_hist')
    ? { values: ind.macd_hist.values, colorPos: '#ef4b5e', colorNeg: '#3fbf8f' } : null);
  if (has('macd_dif')) cvMacd.addSeries(seriesFrom(DATA, 'macd_dif', '#f4cf4d', { width: 1.2 }));
  if (has('macd_dea')) cvMacd.addSeries(seriesFrom(DATA, 'macd_dea', '#3b82f6', { width: 1.2 }));

  // ── 震荡指标（RSI / KDJ 切换）──
  cvOsc.setBars(bars);
  cvOsc.clearSeries();
  if (OSC === 'rsi' && has('rsi')) {
    cvOsc.addSeries(seriesFrom(DATA, 'rsi', '#f23c83', { width: 1.4 }));
    cvOsc.setHlines([
      { value: 70, color: '#5a3a44', label: '70 超买' },
      { value: 50, color: '#2a2a32' },
      { value: 30, color: '#3a5a4a', label: '30 超卖' },
    ]);
  } else if (has('kdj_k')) {
    cvOsc.addSeries(seriesFrom(DATA, 'kdj_k', '#f4cf4d', { width: 1.2 }));
    cvOsc.addSeries(seriesFrom(DATA, 'kdj_d', '#3b82f6', { width: 1.2 }));
    cvOsc.setHlines([{ value: 80, color: '#5a3a44' }, { value: 20, color: '#3a5a4a' }]);
  }

  renderLegends();
  redrawAll();
}

function redrawAll() {
  cvMain.draw(); cvMacd.draw(); cvOsc.draw();
  updateVpInfo();
}

function updateVpInfo() {
  if (!vp || !DATA) return;
  const a = vp.start + 1, b = vp.end;
  $('vpInfo').textContent = `显示第 ${a}–${b} 根 / 共 ${DATA.bars.length} 根（${vp.visibleCount} 根）`;
}

function renderLegends() {
  const L = (items) => items.map(([label, color, dash]) =>
    `<span><i style="background:${color};${dash ? `opacity:.6` : ''}"></i>${label}</span>`).join('');
  $('legendMain').innerHTML = L([
    ['EMA12', '#f4cf4d'], ['EMA26', '#3b82f6'], ['SMA20', '#a78bfa'],
    ['布林上/下轨', '#4a4a54'],
    ['买入', '#ef4b5e'], ['卖出', '#3fbf8f'],
  ]);
  $('legendMacd').innerHTML = L([['DIF', '#f4cf4d'], ['DEA', '#3b82f6'], ['柱', '#6a6a74']]);
  $('legendOsc').innerHTML = OSC === 'rsi'
    ? L([['RSI14', '#f23c83'], ['70/30 参考线', '#5a3a44']])
    : L([['K', '#f4cf4d'], ['D', '#3b82f6']]);
}

/** 光标悬停时显示的详细数据 */
function renderOhlc(i) {
  const row = $('ohlcRow');
  if (!DATA || i === null || !DATA.bars[i]) {
    row.innerHTML = '<span class="mut">把光标移到图上查看某根 K 线的详细数据</span>';
    return;
  }
  const b = DATA.bars[i];
  const prev = DATA.bars[i - 1];
  const chg = prev ? (b.c / prev.c - 1) * 100 : null;
  const ind = DATA.indicators || {};
  const at = k => ind[k]?.values?.[i];
  row.innerHTML = `
    <span class="mut">${esc(b.t)}</span>
    <span>开 <b>${fmt(b.o)}</b></span>
    <span>高 <b class="up">${fmt(b.h)}</b></span>
    <span>低 <b class="dn">${fmt(b.l)}</b></span>
    <span>收 <b class="${cls(chg)}">${fmt(b.c)}</b></span>
    <span>涨跌 <b class="${cls(chg)}">${pctStr(chg)}</b></span>
    <span>量 <b>${fmt(b.v, 0)}</b></span>
    <span class="mut">│</span>
    <span>EMA12 <b>${fmt(at('ema12'))}</b></span>
    <span>EMA26 <b>${fmt(at('ema26'))}</b></span>
    <span>RSI <b>${fmt(at('rsi'), 1)}</b></span>
    <span>MACD <b>${fmt(at('macd_hist'), 4)}</b></span>
    <span>ADX <b>${fmt(at('adx'), 1)}</b></span>`;
}

function tooltipHtml(i) {
  const b = DATA.bars[i];
  const prev = DATA.bars[i - 1];
  const chg = prev ? (b.c / prev.c - 1) * 100 : null;
  const ind = DATA.indicators || {};
  const at = k => ind[k]?.values?.[i];
  const c = chg === null ? 'mut' : chg >= 0 ? 'up' : 'dn';
  return `
    <div style="color:#8b8b94;margin-bottom:3px">${esc(b.t)}</div>
    <div>开 <b>${fmt(b.o)}</b>　高 <b>${fmt(b.h)}</b></div>
    <div>低 <b>${fmt(b.l)}</b>　收 <b class="${c}">${fmt(b.c)}</b></div>
    <div>涨跌 <b class="${c}">${pctStr(chg)}</b>　量 <b>${fmt(b.v, 0)}</b></div>
    <div style="border-top:1px solid #2a2a32;margin:4px 0 3px"></div>
    <div>EMA12 <b>${fmt(at('ema12'))}</b>　EMA26 <b>${fmt(at('ema26'))}</b></div>
    <div>BOLL <b>${fmt(at('bb_lower'))}</b> / <b>${fmt(at('bb_upper'))}</b></div>
    <div>RSI <b>${fmt(at('rsi'), 1)}</b>　ADX <b>${fmt(at('adx'), 1)}</b></div>
    <div>MACD <b>${fmt(at('macd_dif'), 4)}</b>　信号 <b>${fmt(at('macd_dea'), 4)}</b></div>`;
}

// ══════════════════════════════════════════════════════
//  参数优化
// ══════════════════════════════════════════════════════
async function runOptimize() {
  if (!PICKED) return;
  const btn = $('optRun');
  btn.disabled = true;
  $('optInfo').textContent = '优化中…';
  $('bar').style.width = '35%';
  try {
    clearErr();
    const body = {
      market: $('market').value, symbol: PICKED.value,
      interval: $('interval').value,
      strategy: $('optStrategy').value,
      method: $('optMethod').value,
      maxCombos: Number($('optCombos').value) || 60,
      isRatio: Number($('optRatio').value) || 0.7,
      limit: Number($('limit').value) || 500,
    };
    const r = await fetch('/api/optimize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    $('bar').style.width = '100%';
    if (!r.ok || d.error) throw new Error(d.error || `HTTP ${r.status}`);
    renderOptimize(d);
    $('optInfo').textContent = `${d.combos_tested} 组 · ${d.elapsed_ms}ms`;
  } catch (e) {
    $('bar').style.width = '0';
    $('optInfo').textContent = '失败';
    fail('优化失败：' + e.message);
  } finally {
    btn.disabled = false;
    setTimeout(() => { $('bar').style.width = '0'; }, 400);
  }
}

function renderOptimize(d) {
  $('optResultCard').style.display = 'block';
  $('optResultMeta').textContent =
    `${d.meta.name} ${d.symbol} ${d.interval} · ${d.bars_total} 根 → 训练 ${d.bars_is} / 验证 ${d.bars_oos}`;

  // 警告区
  const w = [];
  if (d.meta.benchmarkReturn !== null && d.meta.benchmarkReturn !== undefined) {
    w.push(`<div class="mut">基准（买入持有）<b class="${cls(d.meta.benchmarkReturn)}">${pctStr(d.meta.benchmarkReturn)}</b></div>`);
  }
  if (d.baseline) {
    w.push(`<div class="mut">对照·默认参数：训练 <b class="${cls(d.baseline.is_return)}">${pctStr(d.baseline.is_return)}</b>`
      + `　验证 <b class="${cls(d.baseline.oos_return)}">${pctStr(d.baseline.oos_return)}</b>`
      + `　全样本 <b class="${cls(d.baseline.full_return)}">${pctStr(d.baseline.full_return)}</b></div>`);
  }
  for (const x of (d.warnings || [])) w.push(`<div class="warn-item">⚠ ${esc(x)}</div>`);
  $('optWarnings').innerHTML = `<div style="padding:9px 11px;display:grid;gap:4px">${w.join('')}</div>`;

  // 结果表
  const tb = $('optTable').querySelector('tbody');
  if (!d.top?.length) {
    tb.innerHTML = `<tr><td colspan="8" class="mut" style="text-align:center;padding:16px">
      没有参数组合通过门槛（交易数太少或全部评估失败）</td></tr>`;
    return;
  }
  tb.innerHTML = d.top.map((x, i) => {
    const ps = Object.entries(x.params).map(([a, b]) => `${a}=${b}`).join(', ');
    const flag = x.overfit ? '<span class="badge wn">过拟合</span>' : '';
    return `<tr>
      <td>${esc(ps)} ${flag}</td>
      <td class="num ${cls(x.is_return)}">${pctStr(x.is_return)}</td>
      <td class="num ${cls(x.oos_return)}">${pctStr(x.oos_return)}</td>
      <td class="num ${cls(x.gap)}">${pctStr(x.gap)}</td>
      <td class="num ${cls(x.full_return)}">${pctStr(x.full_return)}</td>
      <td class="num dn">${fmt(x.full_dd)}%</td>
      <td class="num ${cls(x.is_sharpe)}">${fmt(x.is_sharpe)}</td>
      <td class="num">${x.is_trades}</td>
    </tr>`;
  }).join('');
}

boot().then(() => {
  // 调试/自动化钩子：模块作用域的变量外部看不到，
  // 暴露一个只读入口方便验证（也便于以后写端到端测试）。
  window.__PRO = {
    get vp() { return vp; },
    get data() { return DATA; },
    get charts() { return { main: cvMain, macd: cvMacd, osc: cvOsc }; },
    redraw: () => redrawAll(),
    showAll: () => vp.showAll(),
    zoomIn: () => vp.zoom(1.3, 0.5),
    info: () => $('vpInfo').textContent,
    listenerInfo: () => {
      const m = vp?._listeners;
      return {
        isMap: m instanceof Map,
        keys: m ? [...m.keys()] : null,
        changeSize: m?.get?.('change')?.size ?? -1,
        types: m?.get?.('change') ? [...m.get('change')].map(f => typeof f) : null,
      };
    },
  };
}).catch(e => fail('启动失败：' + (e?.message || e)));
</script>
