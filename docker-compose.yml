# ============================================================================
#  quant-spider docker compose
# ----------------------------------------------------------------------------
#  用法：docker compose up -d --build      （或 make compose-up）
#        docker compose down              （或 make compose-down）
#
#  两个服务共用同一个镜像：
#    ui     → node server.mjs          蜘蛛 UI    （默认端口 4317）
#    quant  → node quant/server.mjs    量化看板   （默认端口 4400）
#
#  ⚠ 这里刻意 **不用 ports:**，而是用 network_mode: host。原因（实测，不是猜的）：
#      server.mjs          server.listen(port, '127.0.0.1', ...)      （第 86 行）
#      quant/server.mjs    server.listen(PORT, '127.0.0.1', ...)      （写这份文件时在第 452 行）
#    两个服务都硬编码绑定 127.0.0.1。容器内监听 loopback 时，Docker 的端口发布
#    （-p / ports:）从宿主机转发不进去 —— 转发到容器的 eth0，没人监听。
#    host 网络让容器直接用宿主机网络栈，127.0.0.1:4317 就是宿主机自己的 4317。
#    行号会漂（这两个文件正被别人改），要用内容搜，别信行号。
#
#  ⚠ host 网络的适用范围：
#      · Linux 上的 Docker Engine：可以直接用（本文件的目标场景）。
#      · Docker Desktop（Windows / macOS）：默认不支持 host 网络（4.34+ 有实验性
#        opt-in），这两个端口不会出现在宿主机上。那种环境下要么开 Docker Desktop
#        的 host networking 开关，要么把上面两处监听地址改成 0.0.0.0
#        —— 改监听地址属于源码改动，不在本次基建任务的写入范围内，故未改。
#
#  ⚠ 未实测声明：写这份 compose 的沙箱里没有 docker，也没有 docker compose，
#    所以**没有跑过 docker compose up**，配置文件只做了 YAML 结构校验。
# ============================================================================

# 不写 version: —— Compose V2 已弃用该字段，写了会告警
services:
  ui:
    build: .
    image: quant-spider:latest
    command: ["node", "server.mjs"]
    network_mode: host
    environment:
      # 见 Dockerfile：必须覆盖，否则量化看板会去找 Windows 上的 python.exe
      QUANT_PYTHON: /usr/bin/python3
      PORT: "4317"
    restart: unless-stopped

  quant:
    build: .
    image: quant-spider:latest
    command: ["node", "quant/server.mjs"]
    network_mode: host
    environment:
      QUANT_PYTHON: /usr/bin/python3
      QUANT_PORT: "4400"
      QUANT_TTL: "20000"
    restart: unless-stopped
