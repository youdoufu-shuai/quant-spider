# ============================================================================
#  quant-workbench docker compose
# ----------------------------------------------------------------------------
#  用法：docker compose up -d --build      （或 make compose-up）
#        docker compose down              （或 make compose-down）
#
#  单服务：node quant/server.mjs → 量化工作台（默认端口 4400）
#
#  ⚠ 这里刻意 **不用 ports:**，而是用 network_mode: host。原因（实测，不是猜的）：
#      quant/server.mjs    server.listen(PORT, '127.0.0.1', ...)
#    服务硬编码绑定 127.0.0.1。容器内监听 loopback 时，Docker 的端口发布
#    （-p / ports:）从宿主机转发不进去 —— 转发到容器的 eth0，没人监听。
#    host 网络让容器直接用宿主机网络栈，127.0.0.1:4400 就是宿主机自己的 4400。
#    行号会漂，要用内容搜，别信行号。
#
#  ⚠ host 网络的适用范围：
#      · Linux 上的 Docker Engine：可以直接用（本文件的目标场景）。
#      · Docker Desktop（Windows / macOS）：默认不支持 host 网络（4.34+ 有实验性
#        opt-in），端口不会出现在宿主机上。那种环境下要么开 Docker Desktop
#        的 host networking 开关，要么把监听地址改成 0.0.0.0。
#
#  ⚠ 未实测声明：写这份 compose 的机器上没有 docker，也没有 docker compose，
#    所以**没有跑过 docker compose up**，配置文件只做了 YAML 结构校验。
# ============================================================================

# 不写 version: —— Compose V2 已弃用该字段，写了会告警
services:
  quant:
    build: .
    image: quant-workbench:latest
    command: ["node", "quant/server.mjs"]
    network_mode: host
    environment:
      # 见 Dockerfile：必须覆盖，否则会去找 Windows 上的 python.exe
      QUANT_PYTHON: /usr/bin/python3
      QUANT_PORT: "4400"
      QUANT_TTL: "20000"
    volumes:
      # 持久化：行情缓存、标的列表、模拟盘账户、AI 组合、行情快照
      # 不挂这个卷，容器一删账户和快照就没了
      - quant-state:/app/quant/state
    restart: unless-stopped

volumes:
  quant-state:
